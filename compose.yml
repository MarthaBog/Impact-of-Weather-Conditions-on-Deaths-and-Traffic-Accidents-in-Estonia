services:
  db:
    image: postgres:16
    container_name: weather-impact-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingestion:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: weather-impact-ingestion
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  dbt:
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    container_name: weather-impact-dbt
    env_file:
      - .env
    environment:
      DBT_DB_HOST: db
      DBT_DB_PORT: 5432
      DBT_DB_SCHEMA: public
    volumes:
      - .:/usr/app
    working_dir: /usr/app
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: weather-impact-pipeline
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DBT_DB_HOST: db
      DBT_DB_PORT: 5432
      DBT_DB_SCHEMA: public
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: