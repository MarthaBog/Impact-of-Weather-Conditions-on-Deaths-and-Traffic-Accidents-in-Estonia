services:
  db:
    image: postgres:16
    container_name: weather-impact-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingestion:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: weather-impact-ingestion
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  dbt:
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    container_name: weather-impact-dbt
    env_file:
      - .env
    environment:
      DBT_DB_HOST: db
      DBT_DB_PORT: 5432
      DBT_DB_SCHEMA: public
    volumes:
      - .:/usr/app
    working_dir: /usr/app
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: weather-impact-pipeline
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DBT_DB_HOST: db
      DBT_DB_PORT: 5432
      DBT_DB_SCHEMA: public
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy

  superset:
    build:
      context: .
      dockerfile: docker/superset.Dockerfile
    container_name: weather-impact-superset
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      DATABASE_URI: sqlite:////app/superset_home/superset.db
      SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ports:
      - "8088:8088"
    volumes:
      - ./superset_config.py:/app/superset_config.py
      - superset_home:/app/superset_home
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin \
          --username ${SUPERSET_ADMIN_USERNAME} \
          --firstname Admin \
          --lastname User \
          --email admin@example.com \
          --password ${SUPERSET_ADMIN_PASSWORD} || true
        superset init
        superset run -h 0.0.0.0 -p 8088

volumes:
  postgres_data:
  superset_home: