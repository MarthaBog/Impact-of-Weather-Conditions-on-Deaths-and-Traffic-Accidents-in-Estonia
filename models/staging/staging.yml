version: 2

sources:
  - name: raw
    description: Raw tables loaded by the ingestion scripts.
    schema: public
    tables:
      - name: surmad
        description: Weekly deaths by year, week, sex, and age group.
      - name: onnetused
        description: Traffic accident events with date, county, injuries, and deaths.
      - name: ilm
        description: Daily weather observations in long format by station and metric.

models:
  - name: stg_surmad
    description: Clean weekly deaths source with typed ISO week fields.
    columns:
      - name: week_key
        tests:
          - not_null
      - name: iso_year
        tests:
          - not_null
      - name: iso_week
        tests:
          - not_null
      - name: sex_label
        tests:
          - not_null
      - name: age_group_label
        tests:
          - not_null
      - name: deaths_count
        tests:
          - not_null
  - name: stg_onnetused
    description: Clean traffic accident events with parsed date and normalized county name.
    columns:
      - name: accident_id
        tests:
          - unique
          - not_null
      - name: date_day
        tests:
          - not_null
      - name: county_name
        tests:
          - not_null
      - name: iso_year
        tests:
          - not_null
      - name: iso_week
        tests:
          - not_null
      - name: killed_count
        tests:
          - not_null
      - name: injured_count
        tests:
          - not_null
  - name: stg_ilm
    description: Typed daily weather observations filtered to the core project metrics.
    columns:
      - name: station_code
        tests:
          - not_null
      - name: date_day
        tests:
          - not_null
      - name: iso_year
        tests:
          - not_null
      - name: iso_week
        tests:
          - not_null
      - name: metric_name
        tests:
          - not_null
      - name: metric_value
        tests:
          - not_null
